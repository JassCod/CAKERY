name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Write Supabase settings into config.js
        if: ${{ vars.SUPABASE_URL != '' && vars.SUPABASE_ANON_KEY != '' }}
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          node -e "
            let u = process.env.SUPABASE_URL.trim().replace(/^[\"']|[\"']$/g, '');
            if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
            u = new URL(u).origin;
            const k = process.env.SUPABASE_ANON_KEY.trim().replace(/^[\"']|[\"']$/g, '');
            require('fs').writeFileSync('public/config.js', 'window.CAKERY_CONFIG = ' + JSON.stringify({ supabaseUrl: u, supabaseAnonKey: k }) + ';\n');
            console.log('Supabase project:', u);"
      - name: Make browsers load the new version (cache busting)
        run: |
          V="${GITHUB_SHA::8}"
          find public/js -name '*.js' -exec sed -i -E "s#(['\"])(\.{1,2}/[^'\"?]+\.js)\1#\1\2?v=$V\1#g" {} +
          sed -i -E "s#(src|href)=\"(config\.js|vendor/[^\"?]+|js/app\.js|css/app\.css)\"#\1=\"\2?v=$V\"#g" public/index.html
          grep -n '?v=' public/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
