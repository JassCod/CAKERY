name: Keep Supabase awake

# Supabase's free plan pauses a project after ~7 days without activity.
# This makes one tiny read-only request every day so the shop's database stays online.
on:
  schedule:
    - cron: '17 3 * * *'   # every day at 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping database
        run: |
          URL=$(node -e "global.window={};require('./public/config.js');console.log(window.CAKERY_CONFIG.supabaseUrl)")
          KEY=$(node -e "global.window={};require('./public/config.js');console.log(window.CAKERY_CONFIG.supabaseAnonKey)")
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$URL/rest/v1/rpc/public_info" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H 'Content-Type: application/json' -d '{}')
          echo "Supabase answered HTTP $code"
          test "$code" = "200"
